name: pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest scipy ruff black
      - name: Estilo (ruff y black)
        run: |
          ruff check .
          black --check .
      - name: Pruebas (pytest)
        run: python -m pytest -q
